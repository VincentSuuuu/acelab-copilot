<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ace Lab Max - 内容灵感引擎</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark"><i data-lucide="aperture"></i></div>
          <div>
            <h1>Ace Lab Max</h1>
            <p>Laura's content inspiration workbench</p>
          </div>
        </div>
        <div class="top-actions">
          <span class="engine-pill" id="engine-pill"><i data-lucide="sparkles"></i><span>Gemini</span></span>
          <button class="ghost-button" id="drafts-button" type="button"><i data-lucide="archive"></i>草稿</button>
          <button class="icon-button" id="settings-button" type="button" aria-label="引擎配置"><i data-lucide="settings"></i></button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <aside class="photo-panel" id="photo-panel"></aside>
      <section class="stage-panel" id="stage-panel"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
